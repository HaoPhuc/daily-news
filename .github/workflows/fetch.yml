name: fetch feeds

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (UTC); one run lands shortly before the 07:50 brief
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.yaml, tools/fetch_feeds.py, .github/workflows/fetch.yml]

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Fetch
        run: .venv/bin/python tools/fetch_feeds.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          exit 1
